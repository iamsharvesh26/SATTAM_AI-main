<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATTAM AI - Legal Assistant</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .chat-container { border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .response-box { background: #f9f9f9; padding: 15px; border-radius: 4px; min-height: 100px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <div class="chat-container">
        <h2>SATTAM AI Legal Query</h2>
        
        <div class="input-group">
            <input type="text" id="chat-input" placeholder="Ask a question about Indian Law...">
            <button id="send-btn">Ask AI</button>
        </div>

        <h3>Answer:</h3>
        <div id="chat-response" class="response-box">Your response will appear here...</div>
    </div>

    <script>
        const API_BASE_URL = "http://127.0.0.1:8000";

        async function handleSend() {
            const chatInput = document.getElementById('chat-input');
            const responseBox = document.getElementById('chat-response');
            const question = chatInput.value.trim();

            if (!question) return;

            responseBox.innerText = "Searching legal documents and generating response...";

            try {
                const response = await fetch(`${API_BASE_URL}/api/v1/chat`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question: question })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.detail || `Server error: ${response.status}`);
                }

                const data = await response.json();
                responseBox.innerText = data.answer;
            } catch (error) {
                console.error("Fetch error:", error);
                responseBox.innerText = "Error: " + error.message;
            }
        }

        document.getElementById('send-btn').addEventListener('click', handleSend);
        document.getElementById('chat-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });
    </script>
</body>
</html>
